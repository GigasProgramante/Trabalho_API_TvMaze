<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVMaze Explorer | Catálogo NoSQL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Bibliotecas de interface e módulo responsável pela busca na TVmaze. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js" type="module"></script>
</head>
<body>
    <main class="container py-4">
        <!-- Cabeçalho Oficial TVMaze -->
        <header class="app-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4 p-4">
            <div class="header-titles">
                <h1>TVMaze Explorer</h1>
                <p>Catálogo de Séries & Integração RESTHeart NoSQL</p>
            </div>
            <nav class="d-flex flex-wrap gap-2" aria-label="Navegação principal">
                <a class="btn btn-dark" href="salvas.html">Séries guardadas</a>
                <a class="btn btn-outline-dark" href="painel.html">Painel de indicadores</a>
            </nav>
        </header>

        <!-- Busca na API pública, com filtros locais para os resultados recebidos. -->
        <nav class="mb-4">
            <form id="search-form" class="input-group search-form">
                <input
                    id="search-input"
                    class="form-control"
                    type="search"
                    placeholder="Pesquisar série (ex: Harry, Breaking Bad)..."
                    aria-label="Nome da série"
                    required
                >
                <button class="btn btn-dark" type="submit" aria-label="Buscar séries" title="Buscar">
                    <i class="bi bi-search" aria-hidden="true"></i>
                </button>
                <button
                    id="filter-toggle"
                    class="btn btn-dark"
                    type="button"
                    aria-label="Mostrar filtros"
                    aria-expanded="false"
                    aria-controls="filter-panel"
                    title="Filtrar resultados"
                >
                    <i class="bi bi-funnel" aria-hidden="true"></i>
                </button>
            </form>
            <section id="filter-panel" class="filter-panel mt-3" aria-label="Filtros de busca" hidden>
                <div>
                    <label class="form-label" for="status-filter">Status</label>
                    <select id="status-filter" class="form-select">
                        <option value="">Todos os status</option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="genre-filter">Gênero</label>
                    <select id="genre-filter" class="form-select">
                        <option value="">Todos os gêneros</option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="minimum-score-filter">Pontuação mínima (0 a 10)</label>
                    <input
                        id="minimum-score-filter"
                        class="form-control"
                        type="number"
                        min="0"
                        max="10"
                        step="0.5"
                        placeholder="Sem pontuação mínima"
                    >
                    <small class="form-text">Usa Minha nota quando definida; caso contrário, a nota TVmaze.</small>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button id="apply-filters" class="btn btn-dark" type="button">Aplicar filtros</button>
                    <button id="clear-filters" class="btn btn-outline-dark" type="button">Limpar filtros</button>
                </div>
            </section>
        </nav>

        <!-- Retorno da busca, cadastro ou erros para a pessoa usuária. -->
        <p id="status" class="alert alert-info status-message" aria-live="polite"></p>
        
        <!-- Área preenchida com os cards de resultados pelo script.js. -->
        <div id="series" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>
    </main>
</body>
</html>
