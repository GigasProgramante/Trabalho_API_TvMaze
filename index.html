<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVMaze Explorer | Catálogo NoSQL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js" type="module"></script>
</head>
<body>
    <main class="container py-4">
        <!-- Cabeçalho Oficial TVMaze -->
        <header class="app-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4 p-4">
            <div class="header-titles">
                <h1>TVMaze Explorer</h1>
                <p>Catálogo de Séries & Integração RESTHeart NoSQL</p>
            </div>
            <a class="btn btn-dark" href="salvas.html">Séries guardadas</a>
        </header>

        <!-- Barra de Busca -->
        <nav class="mb-4">
            <form id="search-form" class="input-group search-form">
                <input
                    id="search-input"
                    class="form-control"
                    type="search"
                    placeholder="Pesquisar série (ex: Harry, Breaking Bad)..."
                    aria-label="Nome da série"
                    required
                >
                <button class="btn btn-dark" type="submit"><i class="bi bi-search"></i></button>
            </form>
        </nav>

        <!-- Mensagem de Status -->
        <p id="status" class="alert alert-info status-message" aria-live="polite"></p>
        
        <!-- Grid de Cards das Séries -->
        <div id="series" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>
    </main>
</body>
</html>
