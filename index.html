<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVMaze Explorer | Catálogo NoSQL</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" type="module"></script>
</head>
<body>
    <main class="container">
        <!-- Cabeçalho Oficial TVMaze -->
        <header class="app-header">
            <div class="header-titles">
                <h1>TVMaze Explorer</h1>
                <p>Catálogo de Séries & Integração RESTHeart NoSQL</p>
            </div>
            <a class="header-badge header-badge-link" href="salvas.html">Séries guardadas</a>
        </header>

        <!-- Barra de Busca -->
        <nav>
            <form id="search-form">
                <input
                    id="search-input"
                    type="search"
                    placeholder="Pesquisar série (ex: Harry, Breaking Bad)..."
                    aria-label="Nome da série"
                    required
                >
                <button type="submit">Buscar</button>
            </form>
        </nav>

        <!-- Mensagem de Status -->
        <p id="status" aria-live="polite"></p>
        
        <!-- Grid de Cards das Séries -->
        <div id="series"></div>
    </main>
</body>
</html>
