<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Série | TVMaze & NoSQL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Consulta a TVmaze e preenche o conteúdo da série selecionada. -->
    <script src="js/detalhes.js" type="module"></script>
</head>
<body>
    <main class="container py-4">
        <!-- Cabeçalho -->
        <header class="app-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4 p-4">
            <div class="header-titles">
                <h1>Detalhes da Série</h1>
                <p>Informações completas obtidas via TVMaze API</p>
            </div>
            <a href="index.html" class="btn btn-dark">← Voltar</a>
        </header>

        <!-- Container onde o js/detalhes.js vai injetar os dados -->
        <section id="detalhes" class="card series-details p-4">
            <p id="status" class="alert alert-info mb-0" role="status">A carregar detalhes...</p>
        </section>

        <!-- Formulário para gravar a nota pessoal e o comentário no MongoDB. -->
        <section id="avaliacao" class="card series-details p-4 mt-4" aria-labelledby="avaliacao-titulo" hidden>
            <h2 id="avaliacao-titulo" class="h4 mb-3">Minha avaliação</h2>
            <form id="form-avaliacao">
                <div class="mb-3">
                    <label class="form-label fw-bold" for="minha-nota">Minha nota</label>
                    <select class="form-select" id="minha-nota" name="minhaNota">
                        <option value="">Sem nota</option>
                    </select>
                    <div class="form-text">Escolha uma nota de 0 a 10, em passos de 0,5.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="comentario">Comentário</label>
                    <textarea
                        class="form-control"
                        id="comentario"
                        name="comentario"
                        rows="4"
                        maxlength="2000"
                        placeholder="Escreva sua opinião sobre a série..."
                    ></textarea>
                </div>
                <button class="btn btn-dark" id="salvar-avaliacao" type="submit">Salvar avaliação</button>
                <p id="status-avaliacao" class="mt-3 mb-0" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
