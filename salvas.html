<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séries guardadas | TVMaze Explorer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/salvas.js" type="module"></script>
</head>
<body>
    <main class="container">
        <header class="app-header">
            <div class="header-titles">
                <h1>Séries guardadas</h1>
                <p>Seu catálogo armazenado no banco de dados</p>
            </div>
            <a class="header-badge header-badge-link" href="index.html">Buscar séries</a>
        </header>

        <nav>
            <form id="search-form">
                <input
                    id="search-input"
                    type="search"
                    placeholder="Filtrar séries guardadas..."
                    aria-label="Filtrar séries guardadas"
                >
                <button type="submit">Filtrar</button>
            </form>
        </nav>

        <p id="status" aria-live="polite">Carregando séries do banco...</p>
        <div id="series"></div>
    </main>
</body>
</html>
