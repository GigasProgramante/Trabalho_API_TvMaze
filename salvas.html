<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séries guardadas | TVMaze Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Carrega a listagem salva no banco e habilita o filtro local. -->
    <script src="js/salvas.js" type="module"></script>
</head>
<body>
    <main class="container py-4">
        <header class="app-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4 p-4">
            <div class="header-titles">
                <h1>Séries guardadas</h1>
                <p>Seu catálogo armazenado no banco de dados</p>
            </div>
            <nav class="d-flex flex-wrap gap-2" aria-label="Navegação principal">
                <a class="btn btn-dark" href="index.html">Buscar séries</a>
                <a class="btn btn-outline-dark" href="painel.html">Painel de indicadores</a>
            </nav>
        </header>

        <!-- Busca e filtros locais por nome, status e gênero. -->
        <nav class="mb-4">
            <form id="search-form" class="input-group search-form">
                <input
                    id="search-input"
                    class="form-control"
                    type="search"
                    placeholder="Filtrar séries guardadas..."
                    aria-label="Filtrar séries guardadas"
                >
                <button class="btn btn-dark" type="submit" aria-label="Buscar séries guardadas" title="Buscar">
                    <i class="bi bi-search" aria-hidden="true"></i>
                </button>
                <button
                    id="filter-toggle"
                    class="btn btn-dark"
                    type="button"
                    aria-label="Mostrar filtros"
                    aria-expanded="false"
                    aria-controls="filter-panel"
                    title="Filtrar séries"
                >
                    <i class="bi bi-funnel" aria-hidden="true"></i>
                </button>
            </form>
            <section id="filter-panel" class="filter-panel mt-3" aria-label="Filtros das séries guardadas" hidden>
                <div>
                    <label class="form-label" for="status-filter">Status</label>
                    <select id="status-filter" class="form-select">
                        <option value="">Todos os status</option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="genre-filter">Gênero</label>
                    <select id="genre-filter" class="form-select">
                        <option value="">Todos os gêneros</option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="minimum-score-filter">Pontuação mínima (0 a 10)</label>
                    <input
                        id="minimum-score-filter"
                        class="form-control"
                        type="number"
                        min="0"
                        max="10"
                        step="0.5"
                        placeholder="Sem pontuação mínima"
                    >
                    <small class="form-text">Usa Minha nota quando definida; caso contrário, a nota TVmaze.</small>
                </div>
                <div class="form-check">
                    <input id="favorites-only-filter" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="favorites-only-filter">Mostrar apenas favoritos</label>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button id="apply-filters" class="btn btn-dark" type="button">Aplicar filtros</button>
                    <button id="clear-filters" class="btn btn-outline-dark" type="button">Limpar filtros</button>
                </div>
            </section>
        </nav>

        <!-- Mensagens da consulta e espaço para os cards vindos do RESTHeart. -->
        <p id="status" class="alert alert-info status-message" aria-live="polite">Carregando séries do banco...</p>
        <div id="series" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>
    </main>
</body>
</html>
